name: Build HMS Player (APK + AAB)
on:
  push:
    tags: ['v*']          # release build:  git tag v1.1.0 && git push --tags  (version + versionCode come from the tag)
  workflow_dispatch:      # manual build (artifacts only)
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Decode signing key (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 is missing (see README)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hms-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/hms-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK (internal testing)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PappVersion=${{ steps.v.outputs.version }}
      - name: Build release AAB (Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon -PappVersion=${{ steps.v.outputs.version }}
      - name: Rename outputs
        run: |
          mv app/build/outputs/apk/release/*.apk "HMS-Player-${{ steps.v.outputs.version }}.apk"
          mv app/build/outputs/bundle/release/*.aab "HMS-Player-${{ steps.v.outputs.version }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: HMS-Player-APK
          path: HMS-Player-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HMS-Player-AAB
          path: HMS-Player-*.aab
      # NOTE: nothing is published to Google Play automatically. Upload the AAB artifact manually in Play Console.
